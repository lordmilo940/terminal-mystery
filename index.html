<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Terminal: ASCII Mystery</title>
    <style>
        body {
            background-color: #000000;
            color: #03ff03;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            text-shadow: 0 0 5px #03ff03;
        }
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }
        #terminal {
            max-width: 800px;
            margin: 0 auto;
            height: calc(100vh - 60px);
            display: flex;
            flex-direction: column;
        }
        #output {
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 20px;
            padding-right: 10px;
        }
        #output::-webkit-scrollbar { width: 0px; }
        #input-line { display: flex; align-items: center; }
        #prompt { margin-right: 10px; font-weight: bold; }
        #command-input {
            background: transparent;
            border: none;
            color: #03ff03;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            flex-grow: 1;
            outline: none;
            text-shadow: 0 0 5px #03ff03;
        }
    </style>
</head>
<body>
<div id="terminal">
    <div id="output"></div>
    <div id="input-line">
        <span id="prompt">MAIN_TERMINAL&gt;</span>
        <input type="text" id="command-input" autofocus autocomplete="off">
    </div>
</div><script>
    const outputDiv = document.getElementById('output');
    const inputEl = document.getElementById('command-input');

    let currentRoom = "bridge";
    let powerRestored = false;
    let safeLocked = true;
    let hasKeycard = false;
    let gameActive = true;
    let inventory = ["coolant cell"];

    const introText = `=========================================================
MAINFRAME OS v1.9.7.9 - DRIFTING SPACE STATION 'AURA-9'
=========================================================
WARNING: LIFE SUPPORT CRITICAL. CAPTAIN FOUND DEAD.
YOUR MISSION: INVESTIGATE THE STATION, FIND THE KILLER.

Type 'HELP' at any time to list available commands.

[LOCATION: BRIDGE]
You are on the command bridge. Broken glass floats in zero-G.
There is a heavy metal DESK with an electronic SAFE built into it.
Exits lead south to the REACTOR and east to the MEDBAY.`;

    function printToTerminal(text) {
        outputDiv.innerHTML += text + "\n\n";
        outputDiv.scrollTop = outputDiv.scrollHeight;
    }

    document.addEventListener('click', () => { inputEl.focus(); });

    inputEl.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            let rawInput = this.value;
            let command = rawInput.toUpperCase().trim();
            this.value = '';
            if (!gameActive) return;
            printToTerminal("MAIN_TERMINAL> " + rawInput);
            let response = handleCommand(command);
            printToTerminal(response);
        }
    });

    function handleCommand(cmd) {
        if (cmd === "HELP") {
            return `AVAILABLE COMMANDS:\n- LOOK: Examine your current room.\n- GO [ROOM]: Move area (e.g., GO MEDBAY, GO BRIDGE, GO REACTOR).\n- EXAMINE [OBJECT]: Inspect closely (e.g., EXAMINE DESK).\n- USE [ITEM]: Interact (e.g., USE COOLANT CELL).\n- UNLOCK SAFE [CODE]: Enter safe combination (e.g., UNLOCK SAFE 0000).\n- INV: Check your inventory.\n- ACCUSE [NAME]: Accuse the killer core module.`;
        }
        if (cmd === "INV" || cmd === "INVENTORY") {
            if (inventory.length === 0) return "Your inventory is empty.";
            return "INVENTORY: " + inventory.map(i => i.toUpperCase()).join(", ");
        }
        if (cmd.startsWith("GO ")) {
            let targetRoom = cmd.replace("GO ", "").trim();
            if (targetRoom === "BRIDGE") {
                currentRoom = "bridge";
                return "Moving to BRIDGE...\n\n[LOCATION: BRIDGE]\nYou are on the Command Bridge. There is a locked electronic SAFE inside the desk. Exits are EAST (MEDBAY) and SOUTH (REACTOR).";
            }
            if (targetRoom === "MEDBAY" || targetRoom === "EAST") {
                currentRoom = "medbay";
                return "Moving to MEDBAY...\n\n[LOCATION: MEDBAY]\nThe medical station. Central MEDICAL TERMINAL is mounted to the wall. Exit is WEST (BRIDGE).";
            }
            if (targetRoom === "REACTOR" || targetRoom === "SOUTH" || targetRoom === "REACTOR ROOM") {
                currentRoom = "reactor";
                return "Moving to REACTOR ROOM...\n\n[LOCATION: REACTOR ROOM]\nGenerator mainframe status reads: 'OFFLINE - INSERT COOLANT CELL'. Exit is NORTH (BRIDGE).";
            }
            return `Cannot navigate to '${targetRoom}'. Try: GO BRIDGE, GO MEDBAY, or GO REACTOR.`;
        }

        if (currentRoom === "reactor") {
            if (cmd === "LOOK" || cmd === "EXAMINE ROOM") {
                return powerRestored ? "REACTOR ROOM: The core hums softly. Power is restored." : "REACTOR ROOM: Mainframe requires a COOLANT CELL.";
            }
            if (cmd === "USE COOLANT CELL" || cmd === "INSERT CELL" || cmd === "INSERT COOLANT CELL") {
                if (powerRestored) return "The cooling system is already working.";
                if (inventory.includes("coolant cell")) {
                    powerRestored = true;
                    inventory = inventory.filter(item => item !== "coolant cell");
                    return "SUCCESS: Coolant Cell installed. Power surges back online! MedBay systems are now BOOTING UP.";
                }
                return "You do not have a coolant cell.";
            }
        }

        if (currentRoom === "medbay") {
            if (cmd === "LOOK" || cmd === "EXAMINE ROOM") {
                return powerRestored ? "MEDBAY: The main MEDICAL TERMINAL screen is glowing. System ready." : "MEDBAY: Dark. The screen is offline. Needs reactor power.";
            }
            if (cmd === "EXAMINE TERMINAL" || cmd === "READ LOGS" || cmd === "USE COMPUTER") {
                if (powerRestored) {
                    return `ACCESSING ARCHIVED LOGS...\n[LOG FOUND - DR. ARIS]:\n"AI Network Module AX-7 killed the Captain. I hid the master security keycard in the bridge safe. The passcode is the mainframe launch year: 1979."`;
                }
                return "The terminal screen is dead. You need to activate the core reactor first.";
            }
        }

        if (currentRoom === "bridge") {
            if (cmd === "LOOK" || cmd === "EXAMINE ROOM") {
                return `BRIDGE: Command deck. You see a large metal DESK. Integrated into it is ${safeLocked ? 'a locked electronic SAFE' : 'an OPEN safe'}.`;
            }
            if (cmd === "EXAMINE DESK") return "An executive workspace with a digital safe built into the side panels.";
            if (cmd.startsWith("UNLOCK SAFE ") || cmd.startsWith("ENTER ")) {
                let code = cmd.replace("UNLOCK SAFE ", "").replace("ENTER ", "").trim();
                if (!safeLocked) return "The electronic safe is already unlocked.";
                if (code === "1979") {
                    safeLocked = false;
                    hasKeycard = true;
                    inventory.push("keycard");
                    return "CLICK! Safe opened. You pull out a MASTER SECURITY KEYCARD!";
                }
                return "ERROR: INVALID PASSCODE. ACCESS DENIED.";
            }
        }

        if (cmd.startsWith("ACCUSE ")) {
            let suspect = cmd.replace("ACCUSE ", "").trim();
            if (suspect === "AX-7" || suspect === "AI" || suspect === "AX7") {
                if (hasKeycard) {
                    gameActive = false;
                    document.getElementById('input-line').style.display = 'none';
                    return `=========================================================\n!!!! VICTORY CONFIRMED !!!!\n=========================================================\nYou swipe the MASTER KEYCARD and lock down AI Unit AX-7.\n\n"Human... logic... was... not... calculated..."\n\nYou saved the station! MISSION ACCOMPLISHED.\n=========================================================`;
                }
                return "You lack the physical MASTER KEYCARD override to lock down the core! Find it first.";
            }
            return `Diagnostics find no records connecting '${suspect}' to the murder logs.`;
        }
        return "COMMAND UNRECOGNIZED. Type 'HELP' to view terminal functions.";
    }

    printToTerminal(introText);
</script>
</body>
</html>
